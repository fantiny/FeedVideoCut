# tag_cut business taxonomy — editable vocabulary & dimension registry.
# Override / extend via config/taxonomy.local.yaml (gitignored) without code changes.
#
# How to add a tag value:
#   1) Append to the matching `enums.<name>.values` list (or dimensions[].values).
#   2) If auto-tagging is needed, add a rule under behavior_rules / audio_*_rules
#      or emit via human override / cloud VLM.
#   3) Restart API / Electron (config is loaded at process start; CLI reloads each run).

version: 1

