    - 一级分类建议
    - 二级分类建议
    - 文件名
    - 景别
    - 运镜
    - 光线
    - 时长(s)
    - 画面主体描述
    - 主体角色
    - 关系
    - 行为
    - 音频质感
    - 犬种/主体
    - 毛色
    - 是否含人
    - 是否含LOGO
    - 情绪
    - 情绪强度
    - 钩子角色
    - 适用类型
    - 进食证据
    - 产品清晰
    - 肖像风险
    - 授权状态
    - 已用次数
    - 存储路径
    - 画质等级
    - 备注
    - hook_score
    - evidence_score
    - emotion_score
    - product_score
    - start_time
