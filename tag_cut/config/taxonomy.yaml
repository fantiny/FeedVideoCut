# ---------------------------------------------------------------------------
# Enumerations (append values here to extend business vocab)
# ---------------------------------------------------------------------------
enums:
  shot_scale:
    values: [大特写, 特写, 近景, 中景, 全景, 未知]
    # height ratio thresholds (descending); first match wins
    thresholds:
      - { min_height: 0.60, label: 大特写 }
      - { min_height: 0.40, label: 特写 }
      - { min_height: 0.25, label: 近景 }
      - { min_height: 0.10, label: 中景 }
      - { min_height: 0.0, label: 全景 }
    unknown: 未知

  camera_move:
    values: [固定, 推, 拉, 摇, 手持, 微距, 未知]
    unknown: 未知

  lighting:
    values: [自然光, 棚拍, 混合, 夜景, 未知]
    unknown: 未知

  quality_grade:
    values: [A, B, C, "?"]

  yes_no_unknown:
    values: [是, 否, 未知]

  dog_breed:
    values: [柯基, 金毛, 拉布拉多, 泰迪, 比熊, 柴犬, 其他, 无, 未知]
    unknown: 未知

  fur_color:
    values: [白色, 黑色, 棕色, 金色, 花色, 其他, 无, 未知]
    unknown: 未知

  behavior:
    values:
      - 凑近闻
      - 第一口
      - 大口进食
      - 舔碗
      - 抬头看镜头
      - 摇尾
      - 等待投喂
      - 人物讲解
      - 递碗投喂
      - 状态镜头

  audio_event:
    values: [silent, bark, speech, chew, lick, ambient, 未知]

  audio_texture:
    values: [ASMR咀嚼, 人声讲解, 环境音, 静音, 犬吠, 未知]
    unknown: 未知

  audio_role:
    values: [钩子音效, 证据音, 旁白, 氛围, 未知]
    unknown: 未知

  subject_role:
    values: [狗主体, 人物主体, 人物+狗, 产品主体, 场景]

  applicable_types:
    values: [种草, 科普, 分享, 营销, 通用]

  category_code:
    values:
      - V01_产品特写
      - V02_制作工艺
      - V03_狗狗进食
      - V04_人物出镜
      - V99_待分类
    default: V99_待分类

  emotion:
    values: [兴奋, 期待, 惊喜, 满足, 治愈, 反差, 搞笑, 悬念, 平静, 未知]

  emotion_intensity:
    values: [高, 中, 低]

  hook_role:
    values: [黄金3秒钩子, 证据段, 讲解段, 结尾/情绪段, 过渡/填充]

# ---------------------------------------------------------------------------
# Detection helpers
# ---------------------------------------------------------------------------
vision:
  product_like_classes: [bottle, cup, bowl, book, cell phone, laptop]
  closeup_scales: [大特写, 特写]

# ---------------------------------------------------------------------------
# Declarative L2 rules (order matters; first-matching groups still combine)
# ---------------------------------------------------------------------------
behavior_rules:
  - id: commentary
    emit: 人物讲解
    confidence: 0.75
    when: { audio_any: [speech] }

  - id: feed_bowl
    emit: 递碗投喂
    confidence: 0.5
    when:
      has_person: true
      has_bowl: true
      has_dog: true
      audio_none: [speech]

  - id: first_bite
    emit: 第一口
    confidence: 0.6
    when: { audio_any: [chew], duration_lt: 2.0 }

  - id: eating
    emit: 大口进食
    confidence: 0.65
    when: { audio_any: [chew], duration_gte: 2.0 }

  - id: lick
    emit: 舔碗
    confidence: 0.65
    when: { audio_any: [lick] }

  - id: wag
    emit: 摇尾
    confidence: 0.45
    when: { audio_any: [bark], audio_none: [speech] }

  - id: look_camera
    emit: 抬头看镜头
    confidence: 0.35
    when:
      fallback_only: true
      has_dog: true
      closeup: true
      duration_lte: 1.2

  - id: status
    emit: 状态镜头
    confidence: 0.4
    when:
      fallback_only: true
      has_dog: true
      has_person: false
      duration_gt: 2.5

  - id: waiting
    emit: 等待投喂
    confidence: 0.4
    when: { fallback_only: true, duration_gt: 2.0 }

  - id: approach
    emit: 凑近闻
    confidence: 0.4
    when: { fallback_only: true }

audio_texture_rules:
  - { emit: ASMR咀嚼, confidence: 0.65, audio_any: [chew, lick] }
  - { emit: 人声讲解, confidence: 0.75, audio_any: [speech] }
  - { emit: 犬吠, confidence: 0.6, audio_any: [bark] }
  - { emit: 静音, confidence: 0.7, audio_any: [silent] }
  - { emit: 环境音, confidence: 0.55, audio_any: [ambient] }

audio_role_rules:
  - { emit: 钩子音效, confidence: 0.55, texture: ASMR咀嚼, duration_lt: 2.0 }
  - { emit: 证据音, confidence: 0.55, texture: ASMR咀嚼 }
  - { emit: 旁白, confidence: 0.7, texture: 人声讲解 }
  - { emit: 氛围, confidence: 0.5, texture_any: [环境音, 静音, 犬吠] }

# ---------------------------------------------------------------------------
# Search / UI / export presentation
# ---------------------------------------------------------------------------
search:
  skip_match_types:
    - object_detection
    - lighting_metrics
    - edit_value
    - commercial_evidence
    - usable_duration
    - platform_fit
    - compliance
    - relation_chain
    - subject_layout

ui:
  # Prefer explicit list; if empty, dimensions with ui_featured=true are used
  featured_label_types: []

export:
